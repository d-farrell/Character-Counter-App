<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <script src="./assets/theme-switcher.js" type="module"></script>
    <script src="./assets/text-analyzer.js" type="module"></script>

    <link rel="stylesheet" href="./assets/output.css" />

    <title>Frontend Mentor | Character counter</title>
  </head>
  <body
    class="dark bg-neutral-900 text-neutral-0 bg-[url('/assets/images/bg-dark-theme.png')] bg-cover bg-center bg-no-repeat min-h-screen light:bg-neutral-0 light:text-neutral-900 light:bg-[url('/assets/images/bg-light-theme.png')]"
  >
    <div class="container max-w-5xl">
      <div class="flex justify-between mt-8 mb-12">
        <div>
          <a href="/" class="hover:cursor-pointer">
            <h1 class="sr-only">Character Counter</h1>
            <img
              src="/assets/images/logo-dark-theme.svg"
              alt="logo"
              class="block light:hidden"
            />
            <img
              src="/assets/images/logo-light-theme.svg"
              alt="logo"
              class="hidden light:block"
            />
          </a>
        </div>

        <theme-switcher>
          <button
            data-theme-switcher="lightModeButton"
            class="hover:cursor-pointer text-neutral-0 light:text-neutral-900 bg-neutral-700 p-2 rounded-md"
          >
            <span class="sr-only">Light Mode</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              fill="none"
              viewBox="0 0 22 22"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.98"
                d="M11 1.833v1.834m0 14.666v1.834M3.666 11H1.833m3.955-5.212L4.49 4.492m11.72 1.296 1.297-1.296M5.788 16.215 4.49 17.512m11.72-1.296 1.297 1.296M20.166 11h-1.833m-2.75 0a4.583 4.583 0 1 1-9.167 0 4.583 4.583 0 0 1 9.167 0"
              />
              <defs>
                <clipPath id="a">
                  <path fill="currentColor" d="M0 0h22v22H0z" />
                </clipPath>
              </defs>
            </svg>
          </button>

          <button
            data-theme-switcher="darkModeButton"
            style="display: none"
            class="hover:cursor-pointer text-neutral-0 light:text-neutral-900 bg-neutral-100 p-2 rounded-md"
          >
            <span class="sr-only">Dark Mode</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              fill="none"
              viewBox="0 0 22 22"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.98"
                d="M20.125 11.877A7.333 7.333 0 1 1 10.124 1.875a9.168 9.168 0 1 0 10 10.002Z"
              />
              <defs>
                <clipPath id="a">
                  <path fill="currentColor" d="M0 0h22v22H0z" />
                </clipPath>
              </defs>
            </svg>
          </button>
        </theme-switcher>
      </div>
    </div>

    <div class="container max-w-5xl">
      <h1
        class="text-center text-display text-neutral-0 light:text-neutral-900"
      >
        Analyze your text <br />
        in real-time.
      </h1>

      <text-analyzer class="mt-12 mb-16 block">
        <textarea
          class="w-full h-[200px] p-4 mb-4 rounded-lg border border-neutral-600 bg-neutral-700 text-neutral-200 light:border-neutral-200 light:bg-neutral-100 light:text-neutral-700 text-body-lg focus:outline-none focus:ring-2 focus:ring-blue-400/80 focus:ring-offset-0 focus:drop-shadow-[0_0_5px_theme(colors.blue.400)] resize-none placeholder:text-neutral-200"
          name="text"
          id="text"
          maxlength="300"
          placeholder="Start typing here… (or paste your text)"
          data-text-analyzer="textarea"
        ></textarea>

        <div
          class="flex flex-col md:flex-row gap-4 justify-between md:h-[30px]"
        >
          <div class="flex flex-col md:flex-row gap-4 md:gap-6">
            <div class="flex flex-row items-center gap-2">
              <input
                type="checkbox"
                id="excludeSpaces"
                name="excludeSpaces"
                data-text-analyzer="excludeSpaces"
              />
              <label
                for="excludeSpaces"
                class="text-neutral-200 light:text-neutral-900 text-body"
                >Exclude Spaces</label
              >
            </div>

            <div class="flex flex-row items-center gap-2">
              <input
                type="checkbox"
                id="characterLimitCheckbox"
                name="characterLimitCheckbox"
                data-text-analyzer="characterLimitCheckbox"
              />
              <label
                for="characterLimitCheckbox"
                class="text-neutral-200 light:text-neutral-900 text-body"
                >Set Character Limit</label
              >
              <input
                type="number"
                id="characterLimit"
                name="characterLimit"
                value="300"
                data-text-analyzer="characterLimit"
                style="display: none"
                class="w-[55px] rounded-md border border-neutral-600 light:border-neutral-600 py-[4px] px-[12px] text-body [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
              />
            </div>
          </div>

          <div class="flex flex-row items-center gap-2">
            <p class="text-neutral-0 light:text-neutral-900 text-body">
              Approx. reading time:
              <span id="readingTime" data-text-analyzer="readingTime">0</span>
              <span id="readingTimeUnit" data-text-analyzer="readingTimeUnit"
                >minutes</span
              >
            </p>
          </div>
        </div>

        <div class="grid md:grid-cols-3 gap-4 mt-12">
          <div
            class="flex flex-col gap-2 text-neutral-900 min-h-[150px] min-w-[224px] py-6 px-3 bg-blue-400 rounded-[12px] relative overflow-hidden"
          >
            <span class="text-display" data-text-analyzer="totalCharacters"
              >00</span
            >
            <span class="text-body-lg">Total Characters</span>
            <img
              src="/assets/images/pattern-character-count.svg"
              alt="characters"
              class="absolute top-0 right-[-25px] width-[150px] height-[150px]"
            />
          </div>

          <div
            class="flex flex-col gap-2 text-neutral-900 min-h-[150px] min-w-[224px] py-6 px-3 bg-yellow-500 rounded-[12px] relative overflow-hidden"
          >
            <span class="text-display" data-text-analyzer="wordCount">00</span>
            <span class="text-body-lg">Word Count</span>
            <img
              src="/assets/images/pattern-word-count.svg"
              alt="words"
              class="absolute top-0 right-[-25px] width-[150px] height-[150px]"
            />
          </div>

          <div
            class="flex flex-col gap-2 text-neutral-900 min-h-[150px] min-w-[224px] py-6 px-3 bg-orange-500 rounded-[12px] relative overflow-hidden"
          >
            <span class="text-display" data-text-analyzer="sentenceCount"
              >00</span
            >
            <span class="text-body-lg">Sentence Count</span>
            <img
              src="/assets/images/pattern-sentence-count.svg"
              alt="sentences"
              class="absolute top-0 right-[-25px] width-[150px] height-[150px]"
            />
          </div>
        </div>

        <div class="mt-8 block">
          <p class="text-neutral-0 light:text-neutral-900 text-heading-lg my-5">
            Letter Density:
          </p>

          <p
            data-text-analyzer="densityListEmpty"
            style="display: block"
            class="text-neutral-0 light:text-neutral-900 text-body"
          >
            No characters found. Start typing to see letter density.
          </p>

          <ul
            data-text-analyzer="densityList"
            id="density-list"
            class="mt-4 max-h-[200px] overflow-hidden flex flex-col gap-3 list-none p-0 m-0"
          >
            <!-- list items will be added here as user types-->
          </ul>

          <button
            type="button"
            aria-expanded="false"
            aria-controls="density-list"
            aria-label="See more"
            data-text-analyzer="densityListSeeMore"
            class="text-neutral-0 light:text-neutral-900 text-body mt-4 hover:cursor-pointer"
            style="display: none"
          >
            See More
          </button>
        </div>
      </text-analyzer>
    </div>
  </body>
</html>
