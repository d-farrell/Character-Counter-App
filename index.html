<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <script src="./assets/theme-switcher.js" type="module"></script>
    <script src="./assets/text-analyzer.js" type="module"></script>

    <link rel="stylesheet" href="./assets/output.css">

    <title>Frontend Mentor | Character counter</title>
  </head>
  <body class="dark-mode">
    <theme-switcher>
      <button data-theme-switcher="lightModeButton">Light Mode</button>
      <button data-theme-switcher="darkModeButton" style="display: none;">Dark Mode</button>
    </theme-switcher>

    <h1>Analyze your text in real-time.</h1>

    <text-analyzer>
      <textarea
        name="text"
        id="text"
        placeholder="Start typing here… (or paste your text)"
        maxlength="100"
        data-text-analyzer="textarea"
      ></textarea>

      <div>
        <input
          type="checkbox"
          id="excludeSpaces"
          name="excludeSpaces"
          data-text-analyzer="excludeSpaces"
        />
        <label for="excludeSpaces">Exclude Spaces</label>
      </div>

      <div>
        <label for="characterLimit">Set Character Limit</label>
        <input
          type="checkbox"
          id="characterLimitCheckbox"
          name="characterLimitCheckbox"
          data-text-analyzer="characterLimitCheckbox"
        />
        <input
          type="number"
          id="characterLimit"
          name="characterLimit"
          value="100"
          data-text-analyzer="characterLimit"
          style="display: none;"
        />
      </div>

      <div>
        <p>
          Approx. reading time:
          <span id="readingTime" data-text-analyzer='readingTime'>0</span>
          <span id="readingTimeUnit" data-text-analyzer='readingTimeUnit'>minutes</span>
        </p>
      </div>

      <div>
        <p>
          Total Characters:
          <span data-text-analyzer="totalCharacters">0</span>
        </p>
      </div>

      <div>
        <p>
          Word Count:
          <span data-text-analyzer="wordCount">0</span>
        </p>
      </div>

      <div>
        <p>
          Sentence Count:
          <span data-text-analyzer="sentenceCount">0</span>
        </p>
      </div>

      <div>
        <p>Letter Density:</p>
        <p data-text-analyzer="densityListEmpty" style="display: block;">No characters found. Start typing to see letter density.</p>
        <ul data-text-analyzer="densityList">
          <!-- list items will be added here as user types-->
        </ul>
        <button
          data-text-analyzer="densityListSeeMore"
          style="display: none;"
        >
          See More
        </button>
      </div>
    </text-analyzer>
  </body>
</html>
